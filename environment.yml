name: synthdistill
# Same package versions as the original environment file.
# Changes (to make the environment installable again):
#   * python pinned to 3.8 (all original builds were py38; `imp`-style code paths are gone anyway)
#   * build strings dropped (exact builds are no longer all available) -- versions are unchanged
#   * Idiap bob channel and `bob.extension` removed: the teacher download no longer needs bob
#   * PyTorch CUDA wheel index added, otherwise `torch==1.13.0+cu117` cannot be resolved by pip
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.8
  - pip
  - numpy=1.23.5
  - ninja=1.11.1          # needed to JIT-compile StyleGAN custom CUDA ops
  - click=8.1.3
  - click-plugins=1.1.1
  - pillow=9.2.0
  - scipy=1.10.1
  - requests=2.26.0
  - requests-oauthlib=1.3.1
  - tqdm=4.62.2
  - matplotlib=3.5.3
  - opencv=4.6.0
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu117
    - filelock==3.10.7
    - huggingface-hub==0.13.3
    - timm==0.6.13
    - torch==1.13.0+cu117
    - torchvision==0.14.0+cu117
    - scikit-learn
